[package]
name = "orbyn-store"
description = "The CloudKit-style record store: zones, encrypted records, change tokens and live notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
orbyn-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# Test hooks that must not exist in a build the server uses: a purge scoped to some accounts, so
# tests that share a database do not purge each other's rows. Only this crate's own tests enable it.
test-support = []

[dev-dependencies]
tokio = { workspace = true }
# The crate's own integration tests need the hooks above; enabling the feature here keeps it out of
# every normal build.
orbyn-store = { path = ".", features = ["test-support"] }

[lints]
workspace = true
