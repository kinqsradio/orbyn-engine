[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
orbyn-contracts = { path = "crates/orbyn-contracts" }
orbyn-crypto = { path = "crates/orbyn-crypto" }
orbyn-sync = { path = "crates/orbyn-sync" }
orbyn-core = { path = "crates/orbyn-core" }
orbyn-server = { path = "crates/orbyn-server" }
orbyn-worker = { path = "crates/orbyn-worker" }

argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = "0.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
